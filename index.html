<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini TikTok</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #1a1a1f;
      --accent: #fe2c55;
      --text: #ffffff;
      --text-sub: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }
    
    .feed-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }
    
    .video-card {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .sidebar {
      position: absolute;
      right: 12px;
      bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      z-index: 10;
    }
    .btn-action {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }
    .btn-action.active { color: var(--accent); }
    .action-count { font-size: 11px; font-weight: 600; text-align: center; }
    
    .meta {
      position: absolute;
      left: 14px;
      bottom: 90px;
      right: 70px;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .meta-user { font-weight: 700; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .meta-desc { font-size: 13px; color: #e4e4e7; line-height: 1.3; }
    
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 65px;
      background: rgba(15,15,17,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      z-index: 20;
    }
    .nav button {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav button.active { color: var(--text); font-weight: 600; }
    .nav-post-btn {
      background: linear-gradient(45deg, #00f2fe, var(--accent)) !important;
      color: #fff !important;
      width: 44px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px !important;
      justify-content: center !important;
    }

    /* Модалки */
    .modal {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 30;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
    .input-group input, .input-group textarea {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; display: block; }
    .stats-card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- Лента -->
  <div id="feed" class="feed-container"></div>

  <!-- Навигация -->
  <div class="nav">
    <button class="active" onclick="switchView('feed')">Главная</button>
    <button class="nav-post-btn" onclick="switchView('upload')">+</button>
    <button onclick="switchView('profile')">Профиль</button>
  </div>

  <!-- Модалка загрузки -->
  <div id="modal-upload" class="modal">
    <div class="modal-header">
      <h3>Новое видео</h3>
      <button onclick="switchView('feed')" style="background:none;border:none;color:#fff;font-size:18px;">✕</button>
    </div>
    <div class="input-group">
      <label>Видео (до 19.99 МБ, до 60 сек)</label>
      <input type="file" id="video-file" accept="video/mp4,video/webm,video/quicktime">
    </div>
    <div class="input-group">
      <label>Описание</label>
      <textarea id="video-caption" rows="3" placeholder="Что происходит на видео?"></textarea>
    </div>
    <button class="btn-submit" id="btn-upload" onclick="handleUpload()">Опубликовать</button>
  </div>

  <!-- Модалка профиля -->
  <div id="modal-profile" class="modal">
    <div class="modal-header">
      <h3>Мой профиль</h3>
      <button onclick="switchView('feed')" style="background:none;border:none;color:#fff;font-size:18px;">✕</button>
    </div>
    <img id="my-avatar" class="profile-avatar" src="https://via.placeholder.com/72">
    <div class="stats-card">
      <div style="font-size:24px; font-weight:700; color:var(--accent);" id="total-likes">0</div>
      <div style="font-size:12px; color:var(--text-sub);">Всего лайков получено</div>
    </div>
    <div class="input-group">
      <label>Сменить аватарку</label>
      <input type="file" id="avatar-file" accept="image/*">
    </div>
    <div class="input-group">
      <label>Отображаемое имя</label>
      <input type="text" id="custom-name" placeholder="Введите имя">
    </div>
    <button class="btn-submit" onclick="saveProfile()">Сохранить профиль</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // КОНФИГУРАЦИЯ SUPABASE
    const SUPABASE_URL = "ВАШ_SUPABASE_URL";
    const SUPABASE_KEY = "ВАШ_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    const tgUser = tg.initDataUnsafe?.user || { id: 999999, first_name: "DevUser", username: "dev" };

    async function initUser() {
      // Проверяем существование пользователя
      let { data: user } = await supabase.from('users').select('*').eq('tg_id', tgUser.id).single();

      if (!user) {
        // Проверяем, есть ли вообще записи в базе
        const { count } = await supabase.from('users').select('*', { count: 'exact', head: true });
        const isAdmin = (count === 0); // Первый зарегистрированный — админ

        const newUser = {
          tg_id: tgUser.id,
          username: tgUser.username || '',
          custom_name: tgUser.first_name || 'Пользователь',
          avatar_url: '',
          is_admin: isAdmin,
          is_banned: false
        };

        const { data: created } = await supabase.from('users').insert([newUser]).select().single();
        user = created;
      }

      if (user.is_banned) {
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;color:red;font-size:18px;">Ваш аккаунт заблокирован.</div>';
        return;
      }

      currentUser = user;
      loadFeed();
      loadProfileData();
    }

    // Загрузка ленты
    async function loadFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      const { data: videos } = await supabase
        .from('videos')
        .select('*, users!inner(*)')
        .order('created_at', { ascending: false });

      if (!videos || videos.length === 0) {
        feed.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#777;">Нет видео. Будьте первым!</div>';
        return;
      }

      for (const v of videos) {
        // Проверяем лайк от текущего пользователя
        const { data: liked } = await supabase
          .from('likes')
          .select('user_id')
          .eq('user_id', currentUser.tg_id)
          .eq('video_id', v.id)
          .single();

        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video src="${v.video_url}" loop playsinline onclick="togglePlay(this)"></video>
          <div class="sidebar">
            <button class="btn-action ${liked ? 'active' : ''}" onclick="toggleLike('${v.id}', this)">♥</button>
            <span class="action-count">${v.likes_count}</span>
            ${currentUser.is_admin ? `
              <button class="btn-action" title="Удалить" onclick="adminDeleteVideo('${v.id}')">🗑</button>
              <button class="btn-action" title="Бан" onclick="adminBanUser('${v.author_id}')">🚫</button>
            ` : ''}
          </div>
          <div class="meta">
            <div class="meta-user">
              <img src="${v.users.avatar_url || 'https://via.placeholder.com/28'}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">
              ${v.users.custom_name || v.users.username || 'Аноним'}
            </div>
            <div class="meta-desc">${v.caption || ''}</div>
          </div>
        `;
        feed.appendChild(card);
      }
      setupObserver();
    }

    function togglePlay(vid) {
      if (vid.paused) vid.play();
      else vid.pause();
    }

    // Автовоспроизведение видимого видео
    function setupObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (entry.isIntersecting) {
            video.currentTime = 0;
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
    }

    // Логика лайка
    async function toggleLike(videoId, btn) {
      const isLiked = btn.classList.contains('active');
      const countEl = btn.nextElementSibling;
      let currentCount = parseInt(countEl.innerText) || 0;

      if (isLiked) {
        btn.classList.remove('active');
        countEl.innerText = Math.max(0, currentCount - 1);
        await supabase.from('likes').delete().match({ user_id: currentUser.tg_id, video_id: videoId });
        await supabase.from('videos').update({ likes_count: Math.max(0, currentCount - 1) }).eq('id', videoId);
      } else {
        btn.classList.add('active');
        countEl.innerText = currentCount + 1;
        await supabase.from('likes').insert([{ user_id: currentUser.tg_id, video_id: videoId }]);
        await supabase.from('videos').update({ likes_count: currentCount + 1 }).eq('id', videoId);
      }
    }

    // Загрузка видео с проверками (до 20 МБ, до 60 сек, 1 мин КД)
    async function handleUpload() {
      const fileInput = document.getElementById('video-file');
      const caption = document.getElementById('video-caption').value;
      const file = fileInput.files[0];
      const btn = document.getElementById('btn-upload');

      if (!file) return alert('Выберите файл!');

      // Проверка размера (< 19.99 МБ)
      const maxSize = 19.999 * 1024 * 1024;
      if (file.size > maxSize) return alert('Размер видео превышает 19.99 МБ!');

      // Проверка задержки в 1 минуту
      if (currentUser.last_post_at) {
        const diff = (new Date() - new Date(currentUser.last_post_at)) / 1000;
        if (diff < 60) return alert(`Подождите еще ${Math.ceil(60 - diff)} сек. перед следующей публикацией!`);
      }

      // Проверка длительности видео
      const duration = await getVideoDuration(file);
      if (duration > 60) return alert('Длина видео не должна превышать 60 секунд!');

      btn.innerText = 'Загрузка...';
      btn.disabled = true;

      try {
        const fileExt = file.name.split('.').pop();
        const filePath = `videos/${currentUser.tg_id}_${Date.now()}.${fileExt}`;

        const { error: uploadError } = await supabase.storage.from('media').upload(filePath, file);
        if (uploadError) throw uploadError;

        const { data: { publicUrl } } = supabase.storage.from('media').getPublicUrl(filePath);

        await supabase.from('videos').insert([{
          author_id: currentUser.tg_id,
          video_url: publicUrl,
          caption: caption
        }]);

        const now = new Date().toISOString();
        await supabase.from('users').update({ last_post_at: now }).eq('tg_id', currentUser.tg_id);
        currentUser.last_post_at = now;

        alert('Опубликовано!');
        fileInput.value = '';
        document.getElementById('video-caption').value = '';
        switchView('feed');
        loadFeed();
      } catch (err) {
        alert('Ошибка при загрузке: ' + err.message);
      } finally {
        btn.innerText = 'Опубликовать';
        btn.disabled = false;
      }
    }

    function getVideoDuration(file) {
      return new Promise((resolve) => {
        const vid = document.createElement('video');
        vid.preload = 'metadata';
        vid.onloadedmetadata = () => {
          window.URL.revokeObjectURL(vid.src);
          resolve(vid.duration);
        };
        vid.src = URL.createObjectURL(file);
      });
    }

    // Профиль и статистика лайков
    async function loadProfileData() {
      document.getElementById('custom-name').value = currentUser.custom_name || '';
      if (currentUser.avatar_url) document.getElementById('my-avatar').src = currentUser.avatar_url;

      // Считаем сумму лайков всех видео пользователя
      const { data } = await supabase.from('videos').select('likes_count').eq('author_id', currentUser.tg_id);
      const total = data ? data.reduce((acc, row) => acc + (row.likes_count || 0), 0) : 0;
      document.getElementById('total-likes').innerText = total;
    }

    async function saveProfile() {
      const newName = document.getElementById('custom-name').value;
      const avatarFile = document.getElementById('avatar-file').files[0];
      let newAvatarUrl = currentUser.avatar_url;

      if (avatarFile) {
        const fileExt = avatarFile.name.split('.').pop();
        const path = `avatars/${currentUser.tg_id}_${Date.now()}.${fileExt}`;
        await supabase.storage.from('media').upload(path, avatarFile);
        const { data } = supabase.storage.from('media').getPublicUrl(path);
        newAvatarUrl = data.publicUrl;
      }

      await supabase.from('users').update({
        custom_name: newName,
        avatar_url: newAvatarUrl
      }).eq('tg_id', currentUser.tg_id);

      currentUser.custom_name = newName;
      currentUser.avatar_url = newAvatarUrl;
      document.getElementById('my-avatar').src = newAvatarUrl || 'https://via.placeholder.com/72';
      alert('Профиль обновлен!');
      switchView('feed');
    }

    // Админские действия
    async function adminDeleteVideo(videoId) {
      if (!confirm('Удалить видео?')) return;
      await supabase.from('videos').delete().eq('id', videoId);
      loadFeed();
    }

    async function adminBanUser(targetTgId) {
      if (!confirm('Забанить пользователя?')) return;
      await supabase.from('users').update({ is_banned: true }).eq('tg_id', targetTgId);
      await supabase.from('videos').delete().eq('author_id', targetTgId);
      alert('Пользователь забанен, контент удален.');
      loadFeed();
    }

    // Роутинг между вкладками
    function switchView(view) {
      document.getElementById('modal-upload').style.display = view === 'upload' ? 'flex' : 'none';
      document.getElementById('modal-profile').style.display = view === 'profile' ? 'flex' : 'none';
      if (view === 'profile') loadProfileData();
    }

    initUser();
  </script>
</body>
</html>
